<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020919"/>
      <stop offset="50%" stop-color="#05193d"/>
      <stop offset="100%" stop-color="#020b1f"/>
    </linearGradient>

    <!-- Neon Cyan Border Glow -->
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>

    <!-- Fish Metallic Gradient -->
    <linearGradient id="fishMetallic" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#a5f3fc"/>
      <stop offset="55%" stop-color="#06b6d4"/>
      <stop offset="85%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f2b5c"/>
    </linearGradient>

    <!-- Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#034b94"/>
    </linearGradient>

    <!-- Bubble Gradient -->
    <radialGradient id="bubbleGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#67e8f9" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2"/>
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur1"/>
      <feGaussianBlur stdDeviation="7" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="outerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Ambient Glow Box -->
  <rect x="8" y="8" width="112" height="112" rx="30" fill="none" stroke="#00f5ff" stroke-width="2.5" opacity="0.45" filter="url(#outerGlow)"/>

  <!-- Card Background -->
  <rect x="10" y="10" width="108" height="108" rx="28" fill="url(#bgGrad)"/>

  <!-- Glowing Border -->
  <rect x="10" y="10" width="108" height="108" rx="28" fill="none" stroke="url(#neonBorder)" stroke-width="3" filter="url(#outerGlow)"/>

  <!-- Inner Soft Bevel Highlight -->
  <rect x="13" y="13" width="102" height="102" rx="25" fill="none" stroke="#67e8f9" stroke-width="1" opacity="0.35"/>

  <!-- Water Waves at bottom -->
  <g filter="url(#outerGlow)">
    <!-- Deep wave -->
    <path d="M 12 96 C 24 104, 38 108, 54 104 C 70 100, 84 88, 96 90 C 104 92, 112 99, 116 102 L 116 112 C 114 114, 110 116, 102 116 L 24 116 C 16 116, 12 112, 12 108 Z" fill="#033266" opacity="0.8"/>
    <!-- Middle crest wave -->
    <path d="M 12 88 C 22 96, 32 98, 44 94 C 58 90, 72 80, 88 84 C 98 86, 108 94, 114 98 C 110 106, 88 114, 60 112 C 34 110, 18 100, 12 88 Z" fill="url(#waveGrad)" opacity="0.9"/>
    <!-- Front energetic swirl -->
    <path d="M 14 74 C 20 86, 26 100, 42 104 C 56 108, 74 102, 88 94 C 78 98, 62 101, 48 98 C 34 95, 26 86, 24 76 C 22 70, 18 68, 14 74 Z" fill="#00f5ff"/>
    <!-- Small splash crest -->
    <path d="M 94 82 C 100 80, 106 83, 108 88 C 105 87, 100 86, 96 87 C 93 86, 92 84, 94 82 Z" fill="#67e8f9"/>
    <path d="M 98 76 C 101 74, 104 76, 105 79 C 103 79, 100 78, 98 76 Z" fill="#38bdf8"/>
  </g>

  <!-- Bubbles with 3D glow -->
  <g filter="url(#outerGlow)">
    <circle cx="86" cy="30" r="4" fill="url(#bubbleGrad)" stroke="#67e8f9" stroke-width="0.8"/>
    <circle cx="94" cy="40" r="3.2" fill="url(#bubbleGrad)" stroke="#67e8f9" stroke-width="0.7"/>
    <circle cx="88" cy="48" r="3.6" fill="url(#bubbleGrad)" stroke="#67e8f9" stroke-width="0.7"/>
    <circle cx="78" cy="56" r="2.4" fill="url(#bubbleGrad)" stroke="#67e8f9" stroke-width="0.6"/>
    <circle cx="82" cy="65" r="2.8" fill="url(#bubbleGrad)" stroke="#67e8f9" stroke-width="0.6"/>
    <!-- Bubble highlights -->
    <circle cx="85" cy="28.5" r="1.2" fill="#ffffff" opacity="0.9"/>
    <circle cx="93" cy="38.8" r="1" fill="#ffffff" opacity="0.9"/>
    <circle cx="87" cy="46.8" r="1" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Main Jumping Fish -->
  <g filter="url(#neonGlow)">
    <!-- Dorsal Fin (Top Fin) -->
    <path d="M 44 38 C 50 28, 62 26, 70 29 C 64 34, 58 37, 50 41 Z" fill="#00c8f8" stroke="#ffffff" stroke-width="0.7"/>

    <!-- Pectoral Fin (Side Wing Fin) -->
    <path d="M 62 60 C 65 67, 68 76, 64 82 C 60 78, 58 70, 60 62 Z" fill="#0ea5e9" stroke="#67e8f9" stroke-width="0.8"/>

    <!-- Pelvic Fin (Bottom) -->
    <path d="M 46 72 C 48 78, 51 84, 48 88 C 45 84, 44 78, 46 72 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="0.6"/>

    <!-- Tail Fin (Caudal) -->
    <path d="M 33 82 C 28 88, 22 93, 19 96 C 24 90, 27 82, 28 75 C 26 78, 22 81, 17 83 C 21 78, 26 73, 31 70 C 33 74, 34 78, 33 82 Z" fill="url(#fishMetallic)" stroke="#67e8f9" stroke-width="0.8"/>

    <!-- Fish Body Silhouette & Main Form -->
    <path d="M 31 70 C 32 64, 36 54, 42 46 C 50 37, 62 33, 74 34 C 80 35, 84 37, 88 41 C 89 42, 87 45, 84 46 C 82 46, 81 48, 83 50 C 80 52, 77 53, 73 54 C 68 56, 61 60, 56 66 C 50 72, 44 76, 36 78 C 34 77, 32 74, 31 70 Z" fill="url(#fishMetallic)"/>

    <!-- Fish Belly & Body Highlights -->
    <path d="M 46 44 C 54 38, 66 36, 76 37 C 82 39, 86 42, 85 45 C 79 44, 71 45, 64 49 C 56 54, 50 61, 46 68 C 43 65, 42 58, 44 50 Z" fill="#ffffff" opacity="0.85"/>

    <!-- Fish Dark Contour / Lateral Line -->
    <path d="M 48 52 C 56 46, 66 45, 75 46 C 70 48, 62 52, 56 58 C 52 62, 49 67, 47 70" fill="none" stroke="#00d2ff" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Fish Gill Arc -->
    <path d="M 72 40 C 76 43, 76 49, 72 53" fill="none" stroke="#0284c7" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Fish Eye -->
    <circle cx="78" cy="41" r="3.2" fill="#041b3d" stroke="#67e8f9" stroke-width="1"/>
    <circle cx="78.5" cy="40.5" r="1.4" fill="#00f5ff"/>
    <circle cx="79.2" cy="39.8" r="0.7" fill="#ffffff"/>

    <!-- Mouth Line -->
    <path d="M 87 42 C 85 43, 83 44, 82 46" fill="none" stroke="#041b3d" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>

