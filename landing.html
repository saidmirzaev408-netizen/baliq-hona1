                <img src={selectedArticle.image} alt={selectedArticle.title} className="w-full h-48 object-cover rounded-2xl" />
                <h3 className="text-xl font-bold text-white">{selectedArticle.title}</h3>
                <p className="text-xs text-slate-400">📅 {selectedArticle.date} • ⏱️ {selectedArticle.readTime}</p>
                <p className="text-xs text-slate-200 leading-relaxed">{selectedArticle.summary}</p>
                <div className="pt-2 flex justify-end">
                  <button onClick={() => setSelectedArticle(null)} className="px-4 py-2 rounded-xl bg-turquoise-500 text-navy-950 font-bold text-xs">
                    Yopish
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const rootElement = document.getElementById('root');
    if (rootElement) {
      ReactDOM.createRoot(rootElement).render(<App />);
    }
  </script>
</body>

</html>
